
services:
  clawbot-gateway:
    image: ghcr.io/crafter-feng/clawbot-gateway:latest
    container_name: clawbot-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "6798:6798"      # Web UI + REST API + WebSocket（统一端口）
    environment:
      - TZ=Asia/Shanghai
      - CLAWBOT_DB_PATH=data/clawbot.db
      - CLAWBOT_HOST=0.0.0.0
      - CLAWBOT_PORT=6798
      - CLAWBOT_LOG_LEVEL=info
      # 首次启动会自动生成密码，日志中会显示
      # 如需固定密码可设置：
      # - CLAWBOT_LOGIN_PASSWORD=your_password
      # - CLAWBOT_JWT_SECRET=your_secret
      # - WEIXIN_TOKEN=your_token
      # - WEIXIN_ACCOUNT_ID=your_account_id
    volumes:
      - ./data:/app/data       # 持久化数据库
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
