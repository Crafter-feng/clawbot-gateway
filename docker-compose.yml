version: '3.8'

services:
  clawbot-gateway:
    build: .
    container_name: clawbot-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"      # Web UI + REST API + WebSocket（统一端口）
    environment:
      - TZ=Asia/Shanghai
      - CLAWBOT_DB_PATH=data/clawbot.db
      - CLAWBOT_HOST=0.0.0.0
      - CLAWBOT_PORT=8080
      - CLAWBOT_LOG_LEVEL=info
      - CLAWBOT_LOGIN_PASSWORD=1234  # 登录密码
      # - CLAWBOT_JWT_SECRET=your_secret        # JWT 密钥
      # - WEIXIN_TOKEN=your_token               # 微信 Bot Token
      # - WEIXIN_ACCOUNT_ID=your_account_id     # 微信账号 ID
    volumes:
      - ./data:/app/data       # 持久化数据库
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
