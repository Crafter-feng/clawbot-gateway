[package]
name = "clawbot-gateway-tauri"
version = "3.0.0"
description = "ClawBot Gateway - 微信多后端消息网关"
authors = ["Crafter"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
