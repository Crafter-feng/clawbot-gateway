name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '22'
  RUST_VERSION: 'stable'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # 测试
  # ============================================
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 运行 Go 测试
        run: go test -v -race -count=1 ./...

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 验证前端构建
        run: |
          cd web
          npm ci
          npm run build

  # ============================================
  # Docker 镜像构建
  # ============================================
  build-docker:
    name: 构建 Docker 镜像
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 生成 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # FPK 打包（飞牛 fnOS）
  # ============================================
  build-fpk:
    name: 构建 FPK (${{ matrix.arch }})
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            goarch: amd64
            fnpack_arch: amd64
            fnplatform: X86
            runner: ubuntu-latest
          - arch: arm64
            goarch: arm64
            fnpack_arch: arm64
            fnplatform: ARM
            runner: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: 确定版本号
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "版本号: $VERSION"

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 构建前端
        run: |
          cd web
          npm ci
          npm run build

      - name: 构建 Go 后端 (linux/${{ matrix.goarch }})
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build \
            -ldflags="-X 'clawbot-gateway/internal/version.Version=${VERSION}' -X 'clawbot-gateway/internal/version.Commit=$(git rev-parse --short HEAD)' -X 'clawbot-gateway/internal/version.BuildTime=$(date -u '+%Y-%m-%dT%H:%M:%SZ')'" \
            -o "fpk/app/server/clawbot-gateway" .

      - name: 复制前端文件
        run: |
          rm -rf fpk/app/server/web
          cp -r web/dist fpk/app/server/web/

      - name: 更新 manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version.*/version = ${VERSION}/" fpk/manifest

      - name: 修复脚本权限
        run: |
          for f in fpk/cmd/main fpk/cmd/install_init fpk/cmd/install_callback fpk/cmd/uninstall_init fpk/cmd/uninstall_callback fpk/cmd/upgrade_init fpk/cmd/upgrade_callback fpk/cmd/config_init fpk/cmd/config_callback; do
            [ -f "$f" ] && chmod +x "$f"
          done

      - name: 下载 fnpack 并打包
        run: |
          # 重试3次，处理 CDN 瞬时不稳
          for i in 1 2 3; do
            curl -fsSL -o /tmp/fnpack "https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-${{ matrix.fnpack_arch }}" && break
            echo "下载失败，第${i}次重试..."
            sleep 2
          done
          chmod +x /tmp/fnpack
          cd fpk
          /tmp/fnpack build --directory .
          mv clawbot-gateway.fpk "clawbot-gateway-${{ matrix.fnplatform }}.fpk"
          echo "✅ FPK: $(ls -lh clawbot-gateway-${{ matrix.fnplatform }}.fpk)"

      - name: 上传 FPK
        uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ matrix.arch }}
          path: fpk/clawbot-gateway-*.fpk
          retention-days: 30

  # ============================================
  # Tauri 桌面客户端打包
  # ============================================
  build-desktop:
    name: 构建桌面端 (${{ matrix.os }})
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: macOS
            runner: macos-latest
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            binary_suffix: ''
          - os: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
            binary_suffix: .exe

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: 确定版本号
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Go 侧车二进制
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd ..
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build \
            -ldflags="-X 'clawbot-gateway/internal/version.Version=${VERSION}' -X 'clawbot-gateway/internal/version.Commit=$(git rev-parse --short HEAD)' -X 'clawbot-gateway/internal/version.BuildTime=$(date -u '+%Y-%m-%dT%H:%M:%SZ')'" \
            -o "web/src-tauri/binaries/clawbot-gateway-${{ matrix.target }}${{ matrix.binary_suffix }}" .

      - name: 构建前端
        run: npm run build

      - name: 构建 Tauri 桌面应用
        run: |
          npx tauri build

      - name: 上传桌面端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: web/src-tauri/target/release/bundle/
          retention-days: 30

  # ============================================
  # 发布 Release
  # ============================================
  release:
    name: 发布 Release
    needs: [build-docker, build-fpk, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: 展开目录结构
        run: |
          find ./artifacts -type f | sort

      - name: 确定版本号
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_time=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M CST')" >> $GITHUB_OUTPUT

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ClawBot Gateway v${{ steps.version.outputs.version }}"
          files: |
            ./artifacts/**/*.fpk
            ./artifacts/**/*.dmg
            ./artifacts/**/*.msi
            ./artifacts/**/*.exe
            ./artifacts/**/*.AppImage
            ./artifacts/**/*.deb
          generate_release_notes: true
          body: |
            ## ClawBot Gateway v${{ steps.version.outputs.version }}

            ### 📦 下载

            | 文件 | 平台 |
            |------|------|
            | `clawbot-gateway-X86.fpk` | 飞牛 fnOS x86_64 |
            | `clawbot-gateway-ARM.fpk` | 飞牛 fnOS arm64 |
            | `*.dmg` | macOS (Apple Silicon / Intel) |
            | `*.msi` / `*.exe` | Windows |
            | `*.AppImage` / `*.deb` | Linux |

            ### 🐳 Docker

            ```
            docker pull ghcr.io/${{ github.repository }}:v${{ steps.version.outputs.version }}
            docker pull ghcr.io/${{ github.repository }}:latest
            ```

            ---
            构建时间：${{ steps.version.outputs.build_time }}