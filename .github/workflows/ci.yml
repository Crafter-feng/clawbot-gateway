name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '22'
  RUST_VERSION: 'stable'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # 测试
  # ============================================
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 运行 Go 测试
        run: go test -v -race -count=1 ./...

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 验证前端构建
        run: |
          cd web
          npm ci
          npm run build

  # ============================================
  # Docker 镜像构建
  # ============================================
  build-docker:
    name: 构建 Docker 镜像
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 生成 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # FPK 打包（飞牛 fnOS）
  # 已迁移至 https://github.com/EzFavorites/FnDepot
  # 请在该仓库的 CI 中构建 FPK
  # ============================================

  # ============================================
  # Tauri 桌面客户端打包
  # ============================================
  build-desktop:
    name: 构建桌面端 (${{ matrix.os }})
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: macOS
            runner: macos-latest
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            binary_suffix: ''
          - os: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
            binary_suffix: .exe

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: 确定版本号
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Go 侧车二进制
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd ..
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build \
            -ldflags="-X 'clawbot-gateway/internal/version.Version=${VERSION}' -X 'clawbot-gateway/internal/version.Commit=$(git rev-parse --short HEAD)' -X 'clawbot-gateway/internal/version.BuildTime=$(date -u '+%Y-%m-%dT%H:%M:%SZ')'" \
            -o "web/src-tauri/binaries/clawbot-gateway-${{ matrix.target }}${{ matrix.binary_suffix }}" .

      - name: 构建前端
        run: npm run build

      - name: 构建 Tauri 桌面应用
        run: |
          npx tauri build

      - name: 上传桌面端构建产物
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}-v${{ steps.version.outputs.version }}
          path: web/src-tauri/target/release/bundle/
          compression-level: 0
          retention-days: 30

  # ============================================
  # 发布 Release
  # ============================================
  release:
    name: 发布 Release
    needs: [build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts/
          pattern: '*-v*'

      - name: 验证构建产物
        run: |
          COUNT=$(find ./artifacts -type f | wc -l)
          echo "=== 下载的构建产物 ==="
          find ./artifacts -type f | sort
          echo ""
          echo "文件数量: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::没有下载到任何构建产物，release 终止"
            exit 1
          fi

      - name: 确定版本号
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_time=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M CST')" >> $GITHUB_OUTPUT

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ClawBot Gateway v${{ steps.version.outputs.version }}"
          files: |
            artifacts/*/*.dmg
            artifacts/*/*.msi
            artifacts/*/*.exe
            artifacts/*/*.AppImage
            artifacts/*/*.deb
            artifacts/*/dmg/*.dmg
            artifacts/*/msi/*.msi
            artifacts/*/nsis/*.exe
          generate_release_notes: true
          body: |
            ## ClawBot Gateway v${{ steps.version.outputs.version }}

            ### 📦 下载

            | 文件 | 平台 |
            |------|------|
            | `*.dmg` | macOS (Apple Silicon / Intel) |
            | `*.msi` / `*.exe` | Windows |
            | `*.AppImage` / `*.deb` | Linux |

            ### 📦 FPK (飞牛 fnOS)

            FPK 包已迁移至 [EzFavorites/FnDepot](https://github.com/EzFavorites/FnDepot) 仓库，请在该仓库的 Release 中下载。

            ### 🐳 Docker

            ```
            docker pull ghcr.io/${{ github.repository }}:v${{ steps.version.outputs.version }}
            docker pull ghcr.io/${{ github.repository }}:latest
            ```

            ---
            构建时间：${{ steps.version.outputs.build_time }}